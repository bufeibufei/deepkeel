[project]
name = "deepkeel"
version = "4.1.0"
description = "Durable, observable Harness Agent runtime for governed root and specialist agents built from reusable capability packages."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "bufeibufei", email = "bufeibufei@users.noreply.github.com" },
]
keywords = ["agent", "harness", "langgraph", "mcp", "runtime"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<1.0.0",
  "jsonschema>=4.26.0,<5.0.0",
  "langchain-core>=1.7.0,<2.0.0",
  "langgraph>=1.2.18,<2.0.0",
  "packaging>=26.3,<27.0",
  "pydantic>=2.14.1,<3.0.0",
]

[project.urls]
Repository = "https://github.com/bufeibufei/deepkeel"
Issues = "https://github.com/bufeibufei/deepkeel/issues"
Documentation = "https://github.com/bufeibufei/deepkeel/tree/main/docs"
Changelog = "https://github.com/bufeibufei/deepkeel/blob/main/CHANGELOG.md"

[project.scripts]
deepkeel = "deepkeel.cli:main"

[project.optional-dependencies]
postgres = [
  "psycopg[binary,pool]>=3.3.6,<4.0.0",
]
otel = [
  "opentelemetry-api>=1.45.1,<2.0.0",
]
test = [
  "mypy>=2.4.0,<3.0.0",
  "opentelemetry-sdk>=1.45.1,<2.0.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.17.3,<1.0.0",
  "twine>=7.0.0,<8.0.0",
  "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepkeel*"]

[tool.setuptools.package-data]
deepkeel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"
markers = [
  "postgres: requires DEEPKEEL_TEST_POSTGRES_DSN and the postgres extra",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["deepkeel.discovery_sdk", "deepkeel.hybrid_discovery"]
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true
