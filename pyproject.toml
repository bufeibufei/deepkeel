[project]
name = "deepkeel"
version = "4.1.0rc2"
description = "Durable, observable, capability-driven harness runtime for production-grade AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "bufeibufei", email = "bufeibufei@users.noreply.github.com" },
]
keywords = ["agent", "harness", "langgraph", "mcp", "runtime"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.0,<1.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "langchain-core>=1.2.0,<2.0.0",
  "langgraph>=1.2.0,<2.0.0",
  "packaging>=24.0,<27.0",
  "pydantic>=2.8.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/bufeibufei/deepkeel"
Issues = "https://github.com/bufeibufei/deepkeel/issues"
Documentation = "https://github.com/bufeibufei/deepkeel/tree/main/docs"
Changelog = "https://github.com/bufeibufei/deepkeel/blob/main/CHANGELOG.md"

[project.scripts]
deepkeel = "deepkeel.cli:main"

[project.optional-dependencies]
postgres = [
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
]
otel = [
  "opentelemetry-api>=1.30.0,<2.0.0",
]
test = [
  "mypy>=1.15.0,<2.0.0",
  "opentelemetry-sdk>=1.30.0,<2.0.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0,<8.0.0",
  "ruff>=0.11.0,<1.0.0",
  "types-jsonschema>=4.23.0.20241208",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepkeel*"]

[tool.setuptools.package-data]
deepkeel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"
markers = [
  "postgres: requires DEEPKEEL_TEST_POSTGRES_DSN and the postgres extra",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["build", "dist"]
