name: DeepKeel Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deepkeel-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deepkeel
          POSTGRES_PASSWORD: deepkeel
          POSTGRES_DB: deepkeel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepkeel -d deepkeel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEEPKEEL_TEST_POSTGRES_DSN: postgresql://deepkeel:deepkeel@127.0.0.1:5432/deepkeel_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra test --extra postgres
      - name: Verify fault and recovery contracts
        run: uv run pytest -q tests/test_fault_injection.py tests/test_checkpoint_authority.py
      - name: Verify PostgreSQL contracts
        run: uv run pytest -q -m postgres tests/test_postgres_reference.py
      - name: Verify PostgreSQL multi-worker recovery
        run: >-
          uv run python -m verification.postgres_multiworker
          --requests 64 --workers 12 --max-p95-ms 2000
      - name: Verify Core concurrency baseline
        run: >-
          uv run python verification/concurrency_benchmark.py
          --requests 300 --workers 32 --min-success-rate 1 --max-p95-ms 2000

  build:
    needs: production-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked release dependencies
        run: uv sync --frozen --extra test
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run python verification/release_contract.py --tag "$RELEASE_TAG"
      - name: Run release verification
        run: |
          uv run ruff check src tests verification
          uv run mypy src/deepkeel
          uv run python verification/readme_contract.py
          uv run pytest -q --cov=deepkeel --cov-fail-under=80
          uv build --clear
          uv run python verification/verify_distributions.py dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: deepkeel-distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepkeel-distributions
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PRERELEASE=""
          case "$RELEASE_TAG" in *-rc.*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              $PRERELEASE
          fi

  pypi:
    if: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'enabled' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepkeel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepkeel-distributions
          path: dist
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
