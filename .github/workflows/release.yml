name: Harness Core Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  host-contract:
    uses: bufeibufei/kuitianjiandi/.github/workflows/harness-core.yml@codex/dev-unified-20260727
    with:
      core_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      host_ref: codex/dev-unified-20260727
    secrets:
      HARNESS_CORE_DEPLOY_KEY: ${{ secrets.HARNESS_CORE_DEPLOY_KEY }}
      PRODUCT_HOST_DEPLOY_KEY: ${{ secrets.PRODUCT_HOST_DEPLOY_KEY }}

  release:
    needs: host-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked release dependencies
        run: uv sync --frozen --extra test
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: uv run python verification/release_contract.py --tag "$RELEASE_TAG"
      - name: Run release verification
        run: |
          uv run ruff check src tests verification
          uv run mypy src/harness_core
          uv run pytest -q
          uv build --clear
          uv run python verification/verify_distributions.py dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
