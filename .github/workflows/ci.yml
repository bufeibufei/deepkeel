name: DeepKeel PR Fast Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepkeel-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --frozen --extra test
      - name: Verify formatting and imports
        run: uv run ruff check src tests verification examples
      - name: Verify public type contracts
        run: uv run mypy src/deepkeel
      - name: Verify synchronized documentation
        run: uv run python verification/readme_contract.py
      - name: Run deterministic Core tests
        run: uv run pytest -q -m "not postgres"
