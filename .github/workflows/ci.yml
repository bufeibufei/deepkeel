name: Harness Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install package and test dependencies
        run: uv sync --extra test
      - name: Verify formatting and imports
        run: uv run ruff check src tests verification
      - name: Verify Core type contracts
        run: uv run mypy src/harness_core
      - name: Run package-owned tests with coverage
        run: >-
          uv run pytest -q
          --cov=harness_core
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify wheel and sdist in clean environments
        run: uv run python verification/verify_distributions.py dist
