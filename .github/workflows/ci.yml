name: DeepKeel PR Fast Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepkeel-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --frozen --extra test
      - name: Verify formatting and imports
        run: uv run ruff check src tests verification examples
      - name: Verify public type contracts
        run: uv run mypy src/deepkeel
      - name: Enforce type debt ratchet
        run: uv run python verification/type_debt_budget.py
      - name: Verify synchronized documentation
        run: uv run python verification/readme_contract.py
      - name: Run deterministic Core tests
        run: uv run pytest -q -m "not postgres"
