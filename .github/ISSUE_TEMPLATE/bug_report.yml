name: Bug report
description: Report a reproducible DeepKeel defect
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: DeepKeel version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and adapter versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove credentials, prompts, model payloads, and tenant data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
